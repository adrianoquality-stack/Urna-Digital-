<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#111D35"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#3A7D44"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Outer Border -->
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Urna / Ballot Box Graphic -->
  <g filter="url(#shadow)">
    <!-- Base da Urna -->
    <rect x="106" y="210" width="300" height="200" rx="28" fill="#E2E8F0" stroke="#94A3B8" stroke-width="6"/>
    
    <!-- Topo da Urna -->
    <path d="M136 210 L176 130 L336 130 L376 210 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="6"/>
    
    <!-- Fenda de Inserção de Voto -->
    <rect x="206" y="160" width="100" height="12" rx="6" fill="#1E293B"/>

    <!-- Cédula de Voto Verde Pantanal entrando na urna -->
    <g transform="translate(0, -10)">
      <rect x="220" y="80" width="72" height="90" rx="10" fill="url(#greenGrad)" stroke="#166534" stroke-width="4"/>
      <!-- Símbolo de Confirmação na cédula -->
      <path d="M236 125 L248 137 L276 109" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Placa Central: 70123 VANILDO NEVES -->
    <rect x="136" y="260" width="240" height="96" rx="18" fill="#1B2A4A" stroke="url(#goldGrad)" stroke-width="5"/>
    
    <!-- Texto 70.123 em Amarelo Ouro -->
    <text x="256" y="322" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">70.123</text>
    <text x="256" y="344" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">VANILDO NEVES</text>
  </g>

  <!-- Selo MS 2026 -->
  <g transform="translate(256, 452)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="url(#goldGrad)"/>
    <text x="0" y="6" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#1B2A4A" text-anchor="middle" letter-spacing="1.5">MS • 2026</text>
  </g>
</svg>
